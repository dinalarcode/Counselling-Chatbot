<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konseling Chatbot</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="app-container" class="landing-mode">
        <!-- Header / Branding -->
        <div id="header">
            <h1>Halo, apa yang ingin kamu ceritakan hari ini?</h1>
        </div>

        <!-- Chat History (Hidden initially) -->
        <div id="chat-history">
            <!-- Messages will be appended here -->
        </div>

        <!-- Input Area -->
        <div id="input-container">
            <form id="chat-form">
                <textarea id="user-input" rows="1" placeholder="Ceritakan perasaanmu di sini..." required></textarea>
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>
    <!-- Floating Buttons -->
    <div id="floating-actions" class="hidden">
        <button id="btn-reset" class="float-btn float-reset" title="Reset Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="btn-exit" class="float-btn float-exit" title="Keluar Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </div>

    <!-- Exit Confirmation Modal -->
    <div id="exit-modal" class="modal hidden">
        <div class="modal-content">
            <p>Apakah yakin anda mau keluar dari sesi konseling?</p>
            <div class="modal-actions">
                <button id="btn-confirm-exit" class="btn-iya">Iya</button>
                <button id="btn-cancel-exit" class="btn-tidak">Tidak</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
